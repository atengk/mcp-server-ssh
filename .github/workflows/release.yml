name: Release & Publish (NPM + Docker GHCR)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 pnpm 环境
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 静态类型检查
        run: pnpm typecheck

      - name: 运行单元与端到端测试
        run: pnpm test

      - name: 生产打包构建
        run: pnpm build

      - name: 发布至 NPM 注册表
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 生成 Release 发版说明 (Changelog 驱动与模板保底)
        run: |
          node -e '
          const fs = require("fs");
          const tag = process.env.TAG_NAME || "";
          const cleanTag = tag.replace(/^v/, "");
          let changelogBody = "";

          if (fs.existsSync("CHANGELOG.md")) {
            const content = fs.readFileSync("CHANGELOG.md", "utf8");
            const escaped = cleanTag.replace(/\./g, "\\.");
            const regex = new RegExp(`##\\s+\\[v?${escaped}\\][\\s\\S]*?(?=(?:\\n##\\s+\\[)|$)`, "i");
            const match = content.match(regex);
            if (match) {
              changelogBody = match[0].trim();
            }
          }

          if (!changelogBody) {
            changelogBody = `## 发版概述 (${tag})\n\n本次发版包含生产稳定性优化、架构加固与功能增强。`;
          }

          const fullNotes = [
            changelogBody,
            "",
            "---",
            "### 📦 快速免安装运行 (Quick Start)",
            "在任何支持 MCP 的宿主（Claude Desktop, Cursor, Antigravity, Cline 等）中直接配置：",
            "```bash",
            "npx -y @atengk/mcp-server-ssh",
            "```",
            "",
            "### 🔗 相关资产与生态链接",
            "- 📦 **NPM Registry**: [https://www.npmjs.com/package/@atengk/mcp-server-ssh](https://www.npmjs.com/package/@atengk/mcp-server-ssh)",
            "- 🛡️ **Provenance 验证**: 本次构建由 GitHub Actions 原生 OIDC 签发不可篡改的 Provenance 来源凭据",
            "- 📖 **完整文档与示例**: [https://github.com/atengk/mcp-server-ssh#readme](https://github.com/atengk/mcp-server-ssh#readme)"
          ].join("\n");

          fs.writeFileSync("RELEASE_NOTES.md", fullNotes);
          '
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: 创建 GitHub Release 发版
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Release ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/index.js
            dist/index.d.ts

  publish-docker:
    name: 构建并推送 Docker 多架构镜像至 GHCR
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU 模拟器（多架构支持）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 镜像元数据 (自动计算 Tag 与 Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送多架构镜像 (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

