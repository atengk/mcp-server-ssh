# ==============================================================================
# 工作流模版：Node.js 持续集成流水线 (Node.js CI - pnpm)
# 适用场景：Node.js 前端、全栈、CLI 工具与后端服务的 PR 门禁与质量保障
# 触发条件：
#   - push: 主干分支 (main, master) 代码推送
#   - pull_request: 针对主干分支的 PR 创建、编辑、代码同步
# 核心特性：
#   - 动态并发控制 (Dynamic Concurrency)：PR 提交自动中断陈旧运行，主干提交按序排队
#   - 内部路径短路直通 (Path Fast-Pass)：纯文档改动秒级放行，彻底消除分支保护规则死锁
#   - 分层兼容性矩阵 (Matrix Strategy)：PR 快速验证主流 LTS (Node 20)，主干全量扫描 (Node 18/20/22)
#   - pnpm 极速包管理器与依赖缓存加速
#   - 终审门禁看板 (All Checks Passed)：统一盖戳并直出 GitHub Step Summary 结构化报表
# ==============================================================================

name: Node.js CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: PR 标题规范校验 (仅在 PR 触发时执行)
  # ----------------------------------------------------------------------------
  validate-pr-title:
    name: 校验 PR 标题规范
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: 校验 PR 标题符合 Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  # ----------------------------------------------------------------------------
  # Job 2: 动态探测变更路径 (实现内部短路直通网关)
  # ----------------------------------------------------------------------------
  detect-changes:
    name: 探测变更路径
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.filter.outputs.code }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 分析改动文件类型
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!(*.md|docs/**|.gitignore|.editorconfig|LICENSE)'

  # ----------------------------------------------------------------------------
  # Job 3: 代码风格与类型校验 (Lint & Typecheck)
  # ----------------------------------------------------------------------------
  lint:
    name: 代码规范与静态检查
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code_changed != 'false'
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 代码检查与构建语法校验
        run: |
          if npm run | grep -q "lint"; then pnpm run lint; fi
          if npm run | grep -q "typecheck"; then pnpm run typecheck; fi

  # ----------------------------------------------------------------------------
  # Job 4: 跨 Node.js 版本自动化单元测试矩阵
  # ----------------------------------------------------------------------------
  test:
    name: 自动化测试 (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code_changed != 'false'
    timeout-minutes: 15
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('["20"]') || fromJSON('["18", "20", "22"]') }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 运行单元测试
        run: |
          if npm run | grep -q "test"; then
            pnpm run test
          else
            echo "暂未配置 test 脚本，跳过单元测试执行。"
          fi

  # ----------------------------------------------------------------------------
  # Job 5: 质量门禁终审盖戳 (分支保护规则唯一指定强绑门禁)
  # ----------------------------------------------------------------------------
  all-checks-passed:
    name: 质量门禁终审 (All Checks Passed)
    runs-on: ubuntu-latest
    needs: [detect-changes, validate-pr-title, lint, test]
    if: always()
    timeout-minutes: 5
    steps:
      - name: 汇总校验各任务执行结果
        run: |
          TITLE_RESULT="${{ needs.validate-pr-title.result }}"
          DETECT_RESULT="${{ needs.detect-changes.result }}"
          LINT_RESULT="${{ needs.lint.result }}"
          TEST_RESULT="${{ needs.test.result }}"

          echo "任务状态汇总: PR标题=[$TITLE_RESULT], 变更探测=[$DETECT_RESULT], 规范检查=[$LINT_RESULT], 单测矩阵=[$TEST_RESULT]"

          if [ "$TITLE_RESULT" = "failure" ] || [ "$TITLE_RESULT" = "cancelled" ]; then
            echo "::error::PR 标题规范校验失败！请按照 Conventional Commits 规范修改 PR 标题。"
            exit 1
          fi

          if [ "$DETECT_RESULT" = "failure" ] || [ "$DETECT_RESULT" = "cancelled" ]; then
            echo "::error::变更路径探测任务异常中断！"
            exit 1
          fi

          if [ "$LINT_RESULT" = "failure" ] || [ "$LINT_RESULT" = "cancelled" ]; then
            echo "::error::代码风格与语法规范检查失败！"
            exit 1
          fi

          if [ "$TEST_RESULT" = "failure" ] || [ "$TEST_RESULT" = "cancelled" ]; then
            echo "::error::单元测试失败！门禁熔断阻断。"
            exit 1
          fi

          echo "✅ 全部必要质量门禁已全部通过！"

      - name: 生成门禁看板摘要报告
        if: always()
        run: |
          {
            echo "## 🚦 Node.js CI 质量门禁终审报告"
            echo ""
            echo "| 检查项 | 判定状态 | 执行说明 |"
            echo "| :--- | :---: | :--- |"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "| **PR 标题规范校验** | ${{ needs.validate-pr-title.result == 'success' && '✅ 通过' || '❌ 失败' }} | Conventional Commits 语义化规范 |"
            fi
            echo "| **变更路径探测** | ${{ needs.detect-changes.result == 'success' && '✅ 通过' || '❌ 异常' }} | 区分文档短路与核心代码构建 |"
            if [ "${{ needs.detect-changes.outputs.code_changed }}" = "false" ]; then
              echo "| **代码规范与测试** | ⚡ 短路直通 | 仅涉及文档改动，自动跳过耗时测试并放行 |"
            else
              echo "| **Lint 与语法扫描** | ${{ needs.lint.result == 'success' && '✅ 通过' || '❌ 失败' }} | ESLint / Typecheck 静态分析 |"
              echo "| **单元测试矩阵** | ${{ needs.test.result == 'success' && '✅ 通过' || '❌ 失败' }} | 跨 Node.js 版本兼容性验证 |"
            fi
            echo ""
            echo "> 💡 **分支保护规则建议**：请在 GitHub 仓库设置中将 \`质量门禁终审 (All Checks Passed)\` 设为唯一 Required Status Check。"
          } >> "$GITHUB_STEP_SUMMARY"
